modLoader="javafml"
loaderVersion="[4,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''
logoFile = "icon.png"

[[dependencies.artifactsmerging]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.artifactsmerging]]
    modId="minecraft"
    type="required"
    versionRange="[${mc_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.artifactsmerging]]
    modId="artifacts"
    type="required"
    versionRange="*"
    ordering="NONE"
    side="BOTH"

[[dependencies.artifactsmerging]]
    modId="relics"
    type="optional"
    versionRange="*"
    ordering="NONE"
    side="BOTH"
